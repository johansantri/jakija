<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Partner Rejected</title>
</head>
<body style="font-family: Arial, sans-serif; background-color:#f4f4f4; padding:20px;">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table width="600" style="background:white; padding:30px; border-radius:8px;">
                    <tr>
                        <td>
                            <h2 style="color:#dc2626;">Partner Request Rejected</h2>

                            <p>Dear {{ user.username }},</p>

                            <p>We regret to inform you that your partner request has been <strong>rejected</strong>.</p>

                            {% if note %}
                            <div style="background:#fee2e2; padding:15px; border-radius:5px;">
                                <strong>Reason:</strong><br>
                                {{ note }}
                            </div>
                            {% endif %}

                            <br>

                            <p>If you believe this is a mistake, you may submit a new request.</p>

                            <p>Best regards,<br>
                            The Team</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
